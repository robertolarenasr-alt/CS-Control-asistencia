<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONTROL SECURITY - Sistema Operacional</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 600px;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        .shield-icon {
            width: 60px;
            height: 70px;
            background: linear-gradient(135deg, #ffb703, #fb8500);
            border-radius: 10px 10px 25px 25px;
            margin: 0 auto 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 0 15px rgba(255, 183, 3, 0.4);
        }
        .shield-icon::after {
            content: "🛡️";
            font-size: 28px;
        }
        .badge-sspp {
            background-color: #121826;
            color: #ffb703;
            font-size: 9px;
            padding: 2px 5px;
            border-radius: 4px;
            position: absolute;
            bottom: -4px;
            border: 1px solid #ffb703;
            font-weight: bold;
        }
        h1 {
            font-size: 22px;
            letter-spacing: 1px;
            font-weight: 800;
        }
        .official-tag {
            background-color: #ffb703;
            color: #0b0f19;
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            margin-left: 5px;
            vertical-align: middle;
        }
        .subtitle {
            color: #8d99ae;
            font-size: 11px;
            margin-top: 4px;
        }
        
        /* Navegación de Vistas */
        .nav-tabs {
            display: flex;
            background-color: #121826;
            border: 1px solid #1f293d;
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 20px;
        }
        .nav-tab {
            flex: 1;
            background: transparent;
            border: none;
            color: #94a3b8;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            transition: all 0.2s;
        }
        .nav-tab.active {
            background-color: #ffb703;
            color: #0b0f19;
        }

        .view-section {
            display: none;
        }
        .view-section.active {
            display: block;
        }

        .top-bar {
            background-color: #121826;
            border: 1px solid #1f293d;
            border-radius: 12px;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 12px;
        }
        .clock {
            color: #ffb703;
            font-weight: 650;
        }
        .shifts {
            display: flex;
            gap: 6px;
        }
        .shift-btn {
            background: transparent;
            border: 1px solid #2d3748;
            color: #a0aec0;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 10px;
        }
        .shift-btn.active {
            background: linear-gradient(135deg, #ffb703, #fb8500);
            color: #0b0f19;
            border-color: transparent;
            font-weight: bold;
        }

        .lock-banner {
            background-color: #121826;
            border: 1px solid #1f293d;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            margin-bottom: 15px;
            font-size: 11px;
            color: #cbd5e0;
        }
        .lock-banner span {
            color: #ffb703;
            display: block;
            margin-bottom: 2px;
            font-weight: bold;
        }

        .card {
            background-color: #121826;
            border: 1px solid #1f293d;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .card-badges {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .badge-init {
            background-color: #1e293b;
            color: #94a3b8;
            font-size: 9px;
            padding: 2px 5px;
            border-radius: 4px;
            font-weight: bold;
        }
        .badge-role {
            background-color: rgba(255, 183, 3, 0.15);
            color: #ffb703;
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }
        .card-name {
            font-size: 15px;
            font-weight: bold;
        }
        .card-rut {
            font-size: 11px;
            color: #94a3b8;
        }
        .pin-protected {
            color: #ffb703;
        }
        .fingerprint-btn {
            background-color: #1a2234;
            border: 1px solid #2d3748;
            border-radius: 10px;
            width: 55px;
            height: 55px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .fingerprint-icon {
            font-size: 20px;
        }
        .fingerprint-text {
            font-size: 7px;
            color: #ffb703;
            margin-top: 1px;
            font-weight: bold;
        }

        /* Estilos del panel de administración */
        .admin-form {
            background-color: #121826;
            border: 1px solid #1f293d;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .admin-form h3 {
            font-size: 14px;
            color: #ffb703;
            margin-bottom: 10px;
        }
        .form-group {
            margin-bottom: 10px;
        }
        .form-group label {
            display: block;
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 3px;
        }
        .form-control {
            width: 100%;
            background-color: #0b0f19;
            border: 1px solid #2d3748;
            border-radius: 6px;
            padding: 8px;
            color: #ffffff;
            font-size: 12px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #ffb703, #fb8500);
            color: #0b0f19;
            border: none;
            border-radius: 6px;
            padding: 8px 12px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            width: 100%;
        }
        .btn-delete {
            background-color: #ef4444;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 10px;
            cursor: pointer;
        }
        .admin-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #1a2234;
            padding: 8px 10px;
            border-radius: 6px;
            margin-bottom: 6px;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="shield-icon">
                <div class="badge-sspp">SSPP</div>
            </div>
            <h1>CONTROL SECURITY <span class="official-tag">OFICIAL</span></h1>
            <p class="subtitle">Sistema Operacional de Control de Rondas y Supervisión</p>
        </header>

        <!-- Barra de Pestañas para cambiar entre Operación y Configuración -->
        <div class="nav-tabs">
            <button class="nav-tab active" onclick="switchView('control')">📋 Control de Asistencia</button>
            <button class="nav-tab" onclick="switchView('admin')">⚙️ Configurar Personal</button>
        </div>

        <!-- VISTA 1: CONTROL DE ASISTENCIA -->
        <div id="view-control" class="view-section active">
            <div class="top-bar">
                <div class="clock" id="live-clock">🕒 Cargando hora...</div>
                <div class="shifts">
                    <button class="shift-btn active" onclick="setShift(this)">☀️ AM</button>
                    <button class="shift-btn" onclick="setShift(this)">🌙 PM</button>
                </div>
            </div>

            <div class="lock-banner">
                <span>🔒 PANTALLA DE BLOQUEO • BIOMETRÍA & PIN</span>
                Toque la huella dactilar para registrar asistencia
            </div>

            <div id="personal-list-container">
                <!-- Se cargará dinámicamente desde JavaScript -->
            </div>
        </div>

        <!-- VISTA 2: ADMINISTRACIÓN / CONFIGURACIÓN -->
        <div id="view-admin" class="view-section">
            <div class="admin-form">
                <h3>➕ Agregar Nuevo Funcionario / Guardia</h3>
                <div class="form-group">
                    <label>Nombre Completo</label>
                    <input type="text" id="input-nombre" class="form-control" placeholder="Ej: Juan Pérez">
                </div>
                <div class="form-group">
                    <label>RUT</label>
                    <input type="text" id="input-rut" class="form-control" placeholder="Ej: 12.345.678-9">
                </div>
                <div class="form-group">
                    <label>Cargo / Rol</label>
                    <select id="input-cargo" class="form-control">
                        <option value="Jefe Seguridad">Jefe Seguridad</option>
                        <option value="SSPP">SSPP (Supervisor/Guardia)</option>
                        <option value="Guardia de Ronda">Guardia de Ronda</option>
                    </select>
                </div>
                <button class="btn-primary" onclick="agregarPersona()">Guardar Funcionario</button>
            </div>

            <div class="admin-form">
                <h3>👥 Personal Registrado actualmente</h3>
                <div id="admin-personal-list">
                    <!-- Listado para administrar -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // Reloj en tiempo real
        function actualizarReloj() {
            const ahora = new Date();
            const opciones = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const fechaStr = ahora.toLocaleDateString('es-CL', opciones);
            const horaStr = ahora.toLocaleTimeString('es-CL');
            document.getElementById('live-clock').innerText = `🕒 ${horaStr} • ${fechaStr.charAt(0).toUpperCase() + fechaStr.slice(1)}`;
        }
        setInterval(actualizarReloj, 1000);
        actualizarReloj();

        // Datos iniciales por defecto (si no hay nada guardado)
        let personal = JSON.parse(localStorage.getItem('cs_personal')) || [
            { id: 1, nombre: 'Sebastián Gómez A.', rut: '13.784.602-9', cargo: 'Jefe Seguridad', init: 'SGOMEZ' },
            { id: 2, nombre: 'Cristóbal Hernández', rut: '15.420.198-4', cargo: 'SSPP', init: 'CHERNANDEZ' },
            { id: 3, nombre: 'Consuelo Rodríguez', rut: '16.892.341-K', cargo: 'CRODRIGUEZ' }
        ];

        function guardarEnMemoria() {
            localStorage.setItem('cs_personal', JSON.stringify(personal));
        }

        // Cambiar entre pestañas
        function switchView(viewName) {
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));

            if (viewName === 'control') {
                document.querySelector('.nav-tabs button:nth-child(1)').classList.add('active');
                document.getElementById('view-control').classList.add('active');
                renderizarPantallaControl();
            } else {
                document.querySelector('.nav-tabs button:nth-child(2)').classList.add('active');
                document.getElementById('view-admin').classList.add('active');
                renderizarPanelAdmin();
            }
        }

        // Renderizar lista en la pantalla principal
        function renderizarPantallaControl() {
            const contenedor = document.getElementById('personal-list-container');
            contenedor.innerHTML = '';

            if (personal.length === 0) {
                contenedor.innerHTML = '<p style="text-align:center; color:#8d99ae; font-size:12px; padding:20px;">No hay personal registrado. Vaya a "Configurar Personal" para agregar.</p>';
                return;
            }

            personal.forEach(p => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-info">
                        <div class="card-badges">
                            <span class="badge-init">${p.init}</span>
                            <span class="badge-role">${p.cargo}</span>
                        </div>
                        <div class="card-name">${p.nombre}</div>
                        <div class="card-rut">RUT: ${p.rut} • <span class="pin-protected">🔑 PIN Protegido</span></div>
                    </div>
                    <div class="fingerprint-btn" onclick="registrarAsistencia('${p.nombre}')">
                        <div class="fingerprint-icon">🟠</div>
                        <div class="fingerprint-text">Tocar</div>
                    </div>
                `;
                contenedor.appendChild(card);
            });
        }

        // Renderizar lista en el panel de administración
        function renderizarPanelAdmin() {
            const contenedor = document.getElementById('admin-personal-list');
            contenedor.innerHTML = '';

            if (personal.length === 0) {
                contenedor.innerHTML = '<p style="text-align:center; color:#8d99ae; font-size:11px;">Sin personal.</p>';
                return;
            }

            personal.forEach((p, index) => {
                const item = document.createElement('div');
                item.className = 'admin-list-item';
                item.innerHTML = `
                    <div>
                        <strong>${p.nombre}</strong> (${p.cargo})<br>
                        <span style="color:#94a3b8; font-size:10px;">RUT: ${p.rut}</span>
                    </div>
                    <button class="btn-delete" onclick="eliminarPersona(${index})">Eliminar</button>
                `;
                contenedor.appendChild(item);
            });
        }

        // Agregar persona
        function agregarPersona() {
            const nombre = document.getElementById('input-nombre').value.trim();
            const rut = document.getElementById('input-rut').value.trim();
            const cargo = document.getElementById('input-cargo').value;

            if (!nombre || !rut) {
                alert('Por favor, complete el nombre y el RUT.');
                return;
            }

            // Generar iniciales automáticas (Ej: Juan Perez -> JPEREZ)
            const partes = nombre.toUpperCase().split(' ');
            const init = partes.length > 1 ? partes[0][0] + partes[1] : partes[0];

            personal.push({ id: Date.now(), nombre, rut, cargo, init });
            guardarEnMemoria();

            // Limpiar inputs
            document.getElementById('input-nombre').value = '';
            document.getElementById('input-rut').value = '';

            alert('¡Funcionario agregado con éxito!');
            renderizarPanelAdmin();
        }

        // Eliminar persona
        function eliminarPersona(index) {
            if (confirm('¿Está seguro de eliminar a este funcionario?')) {
                personal.splice(index, 1);
                guardarEnMemoria();
                renderizarPanelAdmin();
            }
        }

        // Simular registro de asistencia
        function registrarAsistencia(nombre) {
            const pin = prompt(`[CONTROL SECURITY]\nIngrese PIN de 4 dígitos para ${nombre}:`);
            if (pin && pin.length >= 4) {
                alert(`¡Asistencia registrada con éxito!\nFuncionario: ${nombre}\nHora: ${new Date().toLocaleTimeString('es-CL')}`);
            } else if (pin !== null) {
                alert('PIN inválido.');
            }
        }

        // Inicializar vista de control al cargar
        renderizarPantallaControl();

        function setShift(button) {
            document.querySelectorAll('.shift-btn').forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');
        }
    </script>
</body>
</html>
